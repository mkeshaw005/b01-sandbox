<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Regional Orders</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 40rem; padding: 0 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #ccc; padding: .5rem; text-align: left; }
    td:last-child, th:last-child { text-align: right; }
    h1 { margin-bottom: .25rem; }
    .subtitle { color: #555; font-size: 1.125rem; font-weight: normal; margin-top: 0; }
  </style>
</head>
<body>
  <h1>Regional Orders</h1>
  <p class="subtitle">Order counts by region</p>
  <p>{{ total }} fake orders</p>
  <table>
    <thead><tr><th>Region</th><th>Orders</th></tr></thead>
    <tbody>
      {% for row in rows %}<tr><td>{{ row.region }}</td><td>{{ row.orders }}</td></tr>{% endfor %}
    </tbody>
  </table>
</body>
</html>
