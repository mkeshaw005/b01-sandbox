name: independent-review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: independent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  independent-review:
    runs-on: ubuntu-latest
    steps:
      # The check script and reviewer list come from main, so a PR cannot change the rules it is judged by.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: platform/checks
      - name: Require an approval from someone other than the submitter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PORTAL_BOT: maker-portal-sandbox[bot]
        run: python3 -I platform/checks/independent_review.py
